<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quote Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Just+Me+Again+Down+Here&family=Shantell+Sans:wght@500&family=Gochi+Hand&family=Caveat:wght@600&family=Nanum+Pen+Script&family=Advent+Pro:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f4;
    --panel: #ffffff;
    --border: #e4e4e4;
    --ink: #2b2b2b;
    --muted: #8a8a8a;
    --accent: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 28px;
  }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; }
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 16px 0 6px;
  }
  label:first-child { margin-top: 0; }
  textarea, input[type=text], select, input[type=range] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafafa;
    color: var(--ink);
  }
  textarea {
    min-height: 90px;
    resize: vertical;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .checkbox-row input { width: auto; }
  .checkbox-row label {
    margin: 0;
    text-transform: none;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 0;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #444; }
  .canvas-holder {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100%;
    max-width: 520px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Quote Card Generator</h1>
    <p class="sub">Fill in the fields — the preview updates live. Download when it looks right.</p>

    <label>Style</label>
    <select id="styleSelect">
      <option value="clean" selected>Clean Card (white card, centered)</option>
      <option value="paper">Paper Texture (photo-style, italic lead-in)</option>
    </select>

    <label>Canvas shape</label>
    <select id="shapeSelect">
      <option value="square">Square (1:1)</option>
      <option value="portrait45">Portrait (4:5)</option>
      <option value="portrait34">Portrait (3:4)</option>
    </select>

    <label>Quote text</label>
    <textarea id="quoteText">"You know you really love someone, when you don't hate them for breaking your heart"</textarea>

    <label>Handle / signature (optional)</label>
    <input type="text" id="handle" value="@mind0nlove">

    <label>Font</label>
    <select id="fontSelect">
      <optgroup label="Handwriting">
        <option value="Itim" selected>Itim (rounded marker)</option>
        <option value="Shantell Sans">Shantell Sans</option>
        <option value="Gochi Hand">Gochi Hand</option>
        <option value="Caveat">Caveat</option>
        <option value="Nanum Pen Script">Nanum Pen Script</option>
        <option value="Just Me Again Down Here">Just Me Again Down Here</option>
        <option value="Advent Pro">Advent Pro (tall/elegant)</option>
      </optgroup>
      <optgroup label="Serif (paper style)">
        <option value="EB Garamond">EB Garamond</option>
        <option value="Playfair Display">Playfair Display</option>
        <option value="Cormorant Garamond">Cormorant Garamond</option>
        <option value="Lora">Lora</option>
        <option value="Georgia">Georgia (system)</option>
      </optgroup>
    </select>

    <div class="checkbox-row" id="italicRow">
      <input type="checkbox" id="italicFirst">
      <label for="italicFirst">Italicize first line</label>
    </div>

    <div id="alignRowWrap">
      <label>Text alignment</label>
      <select id="alignSelect">
        <option value="left">Left</option>
        <option value="center">Center</option>
      </select>
    </div>

    <div class="row" id="colorRow">
      <div>
        <label>Card background</label>
        <input type="text" id="cardColor" value="#ffffff">
      </div>
      <div>
        <label>Outer background</label>
        <input type="text" id="bgColor" value="#d6d6d6">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Text color</label>
        <input type="text" id="textColor" value="#333333">
      </div>
      <div>
        <label>Handle color</label>
        <input type="text" id="handleColor" value="#9a9a9a">
      </div>
    </div>

    <label>Text size <span id="sizeVal"></span></label>
    <input type="range" id="fontSize" min="24" max="72" value="46">

    <button id="downloadBtn">Download PNG</button>
  </div>

  <div class="canvas-holder">
    <canvas id="cardCanvas" width="1254" height="1254"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('cardCanvas');
const ctx = canvas.getContext('2d');

const SHAPES = {
  square: [1254, 1254],
  portrait45: [1254, 1567],
  portrait34: [1254, 1672],
};

const els = {
  style: document.getElementById('styleSelect'),
  shape: document.getElementById('shapeSelect'),
  quote: document.getElementById('quoteText'),
  handle: document.getElementById('handle'),
  font: document.getElementById('fontSelect'),
  italicFirst: document.getElementById('italicFirst'),
  align: document.getElementById('alignSelect'),
  cardColor: document.getElementById('cardColor'),
  bgColor: document.getElementById('bgColor'),
  textColor: document.getElementById('textColor'),
  handleColor: document.getElementById('handleColor'),
  fontSize: document.getElementById('fontSize'),
  sizeVal: document.getElementById('sizeVal'),
};

const colorRow = document.getElementById('colorRow');
const italicRow = document.getElementById('italicRow');
const alignRowWrap = document.getElementById('alignRowWrap');

function clamp(v) { return Math.max(0, Math.min(255, v)); }

// ---------- background caching ----------
const bgCache = { key: '', canvas: document.createElement('canvas') };

function ensureBackground(W, H, style, cardColor, bgColor) {
  const key = [W, H, style, cardColor, bgColor].join('|');
  if (bgCache.key === key) return bgCache.canvas;
  const off = bgCache.canvas;
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  if (style === 'paper') {
    drawPaperTexture(octx, W, H);
  } else {
    drawCleanBackground(octx, W, H, cardColor, bgColor);
  }
  bgCache.key = key;
  return off;
}

function drawCleanBackground(octx, W, H, cardColor, bgColor) {
  octx.clearRect(0, 0, W, H);
  octx.fillStyle = bgColor || '#d6d6d6';
  octx.fillRect(0, 0, W, H);

  const cardMargin = 60;
  const cardX = cardMargin, cardY = cardMargin;
  const cardW = W - cardMargin * 2, cardH = H - cardMargin * 2;
  const radius = 6;

  octx.save();
  octx.shadowColor = 'rgba(0,0,0,0.15)';
  octx.shadowBlur = 24;
  octx.shadowOffsetY = 8;
  roundRect(octx, cardX, cardY, cardW, cardH, radius);
  octx.fillStyle = cardColor || '#ffffff';
  octx.fill();
  octx.restore();
}

function drawPaperTexture(octx, W, H) {
  const grad = octx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#ececea');
  grad.addColorStop(0.5, '#e1e1de');
  grad.addColorStop(1, '#d2d2cf');
  octx.fillStyle = grad;
  octx.fillRect(0, 0, W, H);

  // film grain
  const imgData = octx.getImageData(0, 0, W, H);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 24;
    d[i] = clamp(d[i] + n);
    d[i + 1] = clamp(d[i + 1] + n);
    d[i + 2] = clamp(d[i + 2] + n);
  }
  octx.putImageData(imgData, 0, 0);

  // dark diagonal corner shadow (bottom-right), like the reference photo
  const rg = octx.createRadialGradient(W * 0.92, H * 0.96, W * 0.05, W * 0.92, H * 0.96, W * 0.75);
  rg.addColorStop(0, 'rgba(8,8,8,0.8)');
  rg.addColorStop(0.35, 'rgba(8,8,8,0.28)');
  rg.addColorStop(1, 'rgba(8,8,8,0)');
  octx.fillStyle = rg;
  octx.fillRect(0, 0, W, H);

  // soft light lift top-left
  const rg2 = octx.createRadialGradient(W * 0.12, H * 0.08, 10, W * 0.12, H * 0.08, W * 0.55);
  rg2.addColorStop(0, 'rgba(255,255,255,0.22)');
  rg2.addColorStop(1, 'rgba(255,255,255,0)');
  octx.fillStyle = rg2;
  octx.fillRect(0, 0, W, H);
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// ---------- text layout ----------
function wrapTextWithParagraphs(text, maxWidth, fontSizePx, fontFamily, italicFirst) {
  const paragraphs = text.split('\n');
  const lines = [];
  paragraphs.forEach((p, pi) => {
    const isItalic = italicFirst && pi === 0;
    ctx.font = `${isItalic ? 'italic ' : ''}${fontSizePx}px "${fontFamily}"`;
    const words = p.split(' ');
    let line = '';
    words.forEach(word => {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push({ text: line, italic: isItalic });
        line = word;
      } else {
        line = test;
      }
    });
    lines.push({ text: line, italic: isItalic });
  });
  return lines;
}

function fitFontSize(text, boxWidth, boxHeight, startSize, fontFamily, italicFirst) {
  let size = startSize;
  const lineHeightRatio = 1.42;
  while (size > 16) {
    const lines = wrapTextWithParagraphs(text, boxWidth, size, fontFamily, italicFirst);
    const totalHeight = lines.length * size * lineHeightRatio;
    if (totalHeight <= boxHeight) return { size, lines, lineHeightRatio };
    size -= 2;
  }
  const lines = wrapTextWithParagraphs(text, boxWidth, size, fontFamily, italicFirst);
  return { size, lines, lineHeightRatio };
}

// ---------- main draw ----------
function draw() {
  const style = els.style.value;
  const [W, H] = SHAPES[els.shape.value];
  canvas.width = W;
  canvas.height = H;

  const fontFamily = els.font.value;
  const textColor = els.textColor.value || '#333333';
  const handleColor = els.handleColor.value || '#9a9a9a';
  const baseSize = parseInt(els.fontSize.value, 10);
  els.sizeVal.textContent = baseSize + 'px';
  const italicFirst = els.italicFirst.checked;

  const bg = ensureBackground(W, H, style, els.cardColor.value, els.bgColor.value);
  ctx.drawImage(bg, 0, 0);

  let boxX, boxY, boxW, boxH, align;
  if (style === 'paper') {
    boxX = W * 0.20;
    boxW = W * 0.64;
    boxY = H * 0.28;
    boxH = H * 0.34;
    align = els.align.value;
  } else {
    const cardMargin = 60;
    boxX = cardMargin + 120;
    boxW = (W - cardMargin * 2) - 240;
    boxY = cardMargin;
    boxH = H - cardMargin * 2;
    align = 'center';
  }

  const quote = els.quote.value.trim();
  const fit = fitFontSize(quote, boxW, boxH, baseSize, fontFamily, italicFirst);
  const totalTextHeight = fit.lines.length * fit.size * fit.lineHeightRatio;
  let textY = boxY + boxH / 2 - totalTextHeight / 2 + fit.size;

  ctx.fillStyle = textColor;
  ctx.textBaseline = 'alphabetic';
  fit.lines.forEach(l => {
    ctx.font = `${l.italic ? 'italic ' : ''}${fit.size}px "${fontFamily}"`;
    const lineWidth = ctx.measureText(l.text).width;
    const xPos = align === 'center' ? (boxX + boxW / 2 - lineWidth / 2) : boxX;
    ctx.fillText(l.text, xPos, textY);
    textY += fit.size * fit.lineHeightRatio;
  });

  const handle = els.handle.value.trim();
  if (handle) {
    const margin = style === 'paper' ? 50 : 60;
    ctx.font = `${Math.round(baseSize * 0.4)}px "${fontFamily}"`;
    ctx.fillStyle = handleColor;
    const handleW = ctx.measureText(handle).width;
    ctx.fillText(handle, W - margin - handleW, H - margin);
  }
}

function syncStyleUI() {
  const style = els.style.value;
  if (style === 'paper') {
    colorRow.classList.add('hidden');
    italicRow.classList.remove('hidden');
    alignRowWrap.classList.remove('hidden');
  } else {
    colorRow.classList.remove('hidden');
    italicRow.classList.add('hidden');
    alignRowWrap.classList.add('hidden');
  }
}

els.style.addEventListener('change', () => {
  const style = els.style.value;
  if (style === 'paper') {
    els.shape.value = 'portrait34';
    els.font.value = 'EB Garamond';
    els.italicFirst.checked = true;
    els.align.value = 'left';
    els.textColor.value = '#2a2a2a';
    els.fontSize.value = 40;
  } else {
    els.shape.value = 'square';
    els.font.value = 'Itim';
    els.textColor.value = '#333333';
    els.fontSize.value = 46;
  }
  syncStyleUI();
  draw();
});

[els.shape, els.quote, els.handle, els.font, els.italicFirst, els.align,
 els.cardColor, els.bgColor, els.textColor, els.handleColor, els.fontSize]
  .forEach(el => el.addEventListener('input', draw));

syncStyleUI();

document.fonts.ready.then(() => {
  const fam = ['Itim', 'Shantell Sans', 'Gochi Hand', 'Caveat', 'Nanum Pen Script',
    'Just Me Again Down Here', 'Advent Pro', 'EB Garamond', 'Playfair Display',
    'Cormorant Garamond', 'Lora'];
  const jobs = [];
  fam.forEach(f => {
    jobs.push(document.fonts.load(`46px "${f}"`));
    jobs.push(document.fonts.load(`italic 46px "${f}"`));
  });
  Promise.all(jobs).then(draw).catch(draw);
  draw();
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'quote-card.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
